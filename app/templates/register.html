{% extends "base.html" %}

{% block title %}Register | NoteCampus{% endblock %}

{% block content %}
    <section class="auth-layout">
        <div class="auth-panel">
            <p class="eyebrow">Join NoteCampus</p>
            <h1>Create account</h1>
            <p class="muted">Start uploading and organizing academic material with your classmates.</p>

            <form class="form-card" method="POST">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="paulina" required>

                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Create a password" required>

                <button class="button button-primary button-full" type="submit">Register</button>
            </form>
        </div>
    </section>
{% endblock %}
