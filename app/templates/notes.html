<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
</head>

<body>

    <h1>Notes</h1>

    <a href="{{ url_for('notes.upload_note') }}">
        <button>Upload Note</button>
    </a>

    <hr>

    {% if notes %}

        {% for note in notes %}

            <article>
                <h2>{{ note.title }}</h2>
                <p>{{ note.description }}</p>
                <p>Uploaded by: {{ note.author.username }}</p>
                <a href="{{ note.file_url }}" target="_blank">Open file</a>
                <p>Created at: {{ note.created_at }}</p>
            </article>

            <hr>

        {% endfor %}

    {% else %}

        <p>There are no notes yet.</p>

    {% endif %}

</body>

</html>
