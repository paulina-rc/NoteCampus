<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ note.title }}</title>
</head>

<body>

    <h1>{{ note.title }}</h1>

    <p>{{ note.description }}</p>

    <hr>

    <p>Author: {{ note.author.username }}</p>
    <p>Subject: {{ note.subject.name }}</p>
    <p>Category: {{ note.category.name }}</p>
    <p>Created at: {{ note.created_at }}</p>

    <a href="{{ note.file_url }}" target="_blank">Open file</a>

    <hr>

    <a href="{{ url_for('notes.list_notes') }}">Back to notes</a>

</body>

</html>
