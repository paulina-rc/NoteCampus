<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects</title>
</head>

<body>

    <h1>Subjects</h1>

    {% if subjects %}

        {% for subject in subjects %}

            <article>
                <h2>
                    <a href="{{ url_for('subjects.subject_detail', subject_id=subject.id) }}">
                        {{ subject.name }}
                    </a>
                </h2>

                <p>{{ subject.description }}</p>
                <p>Categories: {{ subject.categories|length }}</p>
                <p>Notes: {{ subject.notes|length }}</p>
            </article>

            <hr>

        {% endfor %}

    {% else %}

        <p>There are no subjects yet.</p>

    {% endif %}

</body>

</html>
